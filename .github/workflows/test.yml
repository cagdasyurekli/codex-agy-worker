name: test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact committed comparison base SHA for a manual release check.
        required: true
        type: string
      head_sha:
        description: Exact committed comparison head SHA for a manual release check.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The suite is deliberately offline — no agy, no API keys, no network — so it
    # runs on every PR.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.ref }}

      - name: committed diff hygiene
        env:
          AGY_WORKER_CI_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
          AGY_WORKER_CI_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
          AGY_WORKER_CI_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
        run: ./scripts/ci-diff-check.sh

      - name: full offline suite and static checks
        run: ./scripts/ci-offline.sh
