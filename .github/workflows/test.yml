name: test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact committed comparison base SHA for a manual release check.
        required: true
        type: string
      head_sha:
        description: Exact committed comparison head SHA for a manual release check.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

      - name: committed diff hygiene
        env:
          AGY_WORKER_CI_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
          AGY_WORKER_CI_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
          AGY_WORKER_CI_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
        run: ./scripts/ci-diff-check.sh

  shard:
    needs: [preflight]
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - dispatcher
          - dispatcher-remediation
          - other-a
          - other-b
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

      - name: shard offline suite
        env:
          AGY_WORKER_CI_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
          RECEIPT_DIR: ${{ runner.temp }}/agyworker-shard-receipt-${{ matrix.shard }}
        run: |
          (umask 077 && mkdir "$RECEIPT_DIR")
          chmod 0700 "$RECEIPT_DIR"
          ./scripts/ci-offline.sh --shard "${{ matrix.shard }}" --receipt "$RECEIPT_DIR/${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shard-receipt-${{ matrix.shard }}
          path: ${{ runner.temp }}/agyworker-shard-receipt-${{ matrix.shard }}/${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  test:
    name: test
    if: always()
    needs: [preflight, shard]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

      - name: download shard receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shard-receipt-*
          path: ${{ runner.temp }}/downloaded-shard-receipts

      - name: verify aggregate shard receipts
        env:
          AGY_WORKER_CI_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          RECEIPTS_DIR: ${{ runner.temp }}/downloaded-shard-receipts
        run: |
          if [[ "${PREFLIGHT_RESULT}" != success ]]; then
            printf '%s\n' 'CI preflight did not succeed' >&2
            exit 1
          fi
          /usr/bin/python3 -I -S -B scripts/ci_sharding.py verify-aggregate \
            --receipts-dir "${RECEIPTS_DIR}" \
            --expected-head "${AGY_WORKER_CI_HEAD_SHA}" \
            --producer-result "${SHARD_RESULT}"
