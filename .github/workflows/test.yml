name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is deliberately offline — no agy, no API keys, no network — so it
    # runs on every PR.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: committed diff hygiene
        env:
          AGY_WORKER_CI_EVENT_NAME: ${{ github.event_name }}
          AGY_WORKER_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AGY_WORKER_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-diff-check.sh

      - name: syntax
        run: for f in ./*.sh conformance/*.sh scripts/*.sh tests/*.sh skills/*/scripts/*.sh skills/*/runtime/*.sh; do bash -n "$f"; done

      - name: Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/codex-agy-worker-pycache
        run: python3 -m py_compile conformance/v1/*.py scripts/*.py skills/*/runtime/scripts/*.py

      - name: qa-gate suite
        run: ./tests/test-qa-gate.sh

      - name: Evidence Receipt v1 suite
        run: ./tests/test-evidence-receipt.sh

      - name: Evidence Report suite
        run: ./tests/test-evidence-report.sh

      - name: offline benchmark suite
        run: /usr/bin/python3 -I -S -B tests/test-benchmark.py

      - name: local job lifecycle suite
        run: /usr/bin/python3 -I -S -B tests/test-job-lifecycle.py

      - name: dispatcher suite
        run: ./tests/test-agy-worker.sh

      - name: updater suite
        run: ./tests/test-update.sh

      - name: canonical version attestation runner
        run: /usr/bin/python3 -I -S -B tests/test-version-attestation-runner.py

      - name: version attestation mutation harness
        run: /usr/bin/python3 -I -S -B tests/test-version-attestation-harness.py

      - name: canonical models inventory attestation runner
        run: /usr/bin/python3 -I -S -B tests/test-models-attestation-runner.py

      - name: reporting suite
        run: ./tests/test-reporting.sh

      - name: Codex distribution suite
        run: ./tests/test-packaging.sh

      - name: read-only doctor suite
        run: ./tests/test-doctor.sh

      - name: public gate conformance suite
        run: /usr/bin/python3 -I -S -B tests/test-conformance.py

      - name: starter proof suite
        run: ./tests/test-proof-demo.sh
