name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is deliberately offline — no agy, no API keys, no network — so it
    # runs on every PR.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax
        run: for f in ./*.sh tests/*.sh skills/*/scripts/*.sh skills/*/runtime/*.sh; do bash -n "$f"; done

      - name: Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/codex-agy-worker-pycache
        run: python3 -m py_compile scripts/*.py skills/*/runtime/scripts/*.py

      - name: qa-gate suite
        run: ./tests/test-qa-gate.sh

      - name: Evidence Receipt v1 suite
        run: ./tests/test-evidence-receipt.sh

      - name: dispatcher suite
        run: ./tests/test-agy-worker.sh

      - name: updater suite
        run: ./tests/test-update.sh

      - name: canonical version attestation runner
        run: python3 -I -S -B tests/test-version-attestation-runner.py

      - name: version attestation mutation harness
        run: python3 -I -S -B tests/test-version-attestation-harness.py

      - name: reporting suite
        run: ./tests/test-reporting.sh

      - name: Codex distribution suite
        run: ./tests/test-packaging.sh

      - name: read-only doctor suite
        run: ./tests/test-doctor.sh

      - name: starter proof suite
        run: ./tests/test-proof-demo.sh
