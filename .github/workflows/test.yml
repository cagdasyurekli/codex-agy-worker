name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is deliberately offline — no agy, no API keys, no network — so it
    # runs on any box and on every PR.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'   # preinstalled there; not worth installing twice
        continue-on-error: true            # advisory: style findings shouldn't gate the suite
        run: shellcheck -S warning ./*.sh tests/*.sh

      - name: syntax
        run: for f in ./*.sh tests/*.sh; do bash -n "$f"; done

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: qa-gate suite
        run: ./tests/test-qa-gate.sh

      - name: dispatcher suite
        run: ./tests/test-agy-worker.sh

      - name: updater suite
        run: ./tests/test-update.sh

      - name: reporting suite
        run: ./tests/test-reporting.sh
