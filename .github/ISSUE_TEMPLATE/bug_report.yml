name: Bug report
description: Report a reproducible defect without uploading private code or logs
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve codex-agy-worker. Do not paste prompts, source
        code, envelopes, credentials, absolute paths, or raw logs. Use sanitized
        excerpts and synthetic reproductions only.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - agy-worker dispatcher
        - QA gate
        - Codex skill or installer
        - Updater or compatibility check
        - Bug reporting workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and its impact using sanitized details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Give the smallest safe steps that reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Sanitized versions
      description: codex-agy-worker tag/commit, agy version, OS name and architecture only.
      placeholder: "tool v1.2.3; agy 1.1.9; macOS arm64"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence checklist
      options:
        - label: I removed prompts, source code, envelopes, credentials, paths, and raw logs.
          required: true
        - label: I reproduced this with synthetic or non-sensitive inputs.
          required: true
        - label: I ran the relevant offline test suite or explained why I could not.
          required: true
