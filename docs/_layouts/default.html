<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.canonical_url | default: site.canonical_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.canonical_url | default: site.canonical_url }}">
    <meta property="og:image" content="{{ site.social_image_url | escape }}">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="640">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ site.social_image_url | escape }}">
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: light)" href="{{ '/assets/brand/logo-micro-light-16.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)" href="{{ '/assets/brand/logo-micro-dark-16.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="{{ '/assets/brand/logo-micro-light-32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="{{ '/assets/brand/logo-micro-dark-32.png' | relative_url }}">
    <style>
      body { font: 18px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 820px; padding: 2rem 1.25rem 4rem; color: #17202a; }
      h1, h2 { line-height: 1.2; }
      code, pre { font-family: ui-monospace, monospace; }
      pre { overflow-x: auto; padding: 1rem; background: #f4f6f7; border-radius: .5rem; }
      a { color: #075cc8; }
      .callout { border-left: 4px solid #075cc8; padding: .2rem 1rem; background: #f5f9ff; }
      .site-brand { margin-bottom: 2rem; }
      .site-brand a { align-items: center; color: inherit; display: inline-flex; font-size: 1.1rem; font-weight: 700; gap: .75rem; text-decoration: none; }
      .site-brand img { display: block; height: 56px; width: 56px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        a { color: #58a6ff; }
        pre { background: #161b22; }
        .callout { background: #111d2e; border-left-color: #58a6ff; }
      }
    </style>
  </head>
  <body>
    <header class="site-brand">
      <a href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
        <picture aria-hidden="true">
          <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/brand/logo-dark.svg' | relative_url }}">
          <img src="{{ '/assets/brand/logo-light.svg' | relative_url }}" alt="" width="56" height="56">
        </picture>
        <span>{{ site.title }}</span>
      </a>
    </header>
    <main>{{ content }}</main>
  </body>
</html>
